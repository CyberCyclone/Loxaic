name: Release

# Cutting a release is pushing a tag:
#   v1.2.3          → production (and beta, which is a superset of it)
#   v1.2.3-beta.4   → beta only
#
# The version is stamped from the tag rather than committed (see
# apps/desktop/scripts/stamp-version.mjs), so nothing here writes back to the
# repository.
#
# The release is created as a *draft* first and undrafted last, and that
# ordering is what makes it safe: GitHub's `/releases/latest` and its Atom
# feed both skip drafts, so the running desktop app cannot see a release
# whose installers are still uploading — or one where a platform failed to
# build at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to (re)publish, e.g. v1.2.3
        required: true
      force_native_build:
        description: Build native binaries even if this runtime already has some
        type: boolean
        default: false

# Nothing here writes to the repository — the version is stamped, not
# committed — so read is all the checkout needs. The desktop-installer stage
# raises this to write for the job that creates the GitHub release.
permissions:
  contents: read

# Never two releases of the same tag at once, and never cancel one halfway:
# a partially published release is worse than a slow one.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: parse tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      channel: ${{ steps.parse.outputs.channel }}
      sha: ${{ steps.parse.outputs.sha }}
      # Which app variants this tag publishes. A beta tag is beta only; a
      # release publishes to production *and* beta, so a beta tester is never
      # left on an older build than the stable release they would otherwise
      # have had. On the desktop that means the beta variant is built for a
      # stable tag too — see the feed note in scripts/builder-variants.cjs.
      variants: ${{ steps.parse.outputs.variants }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tag's own commit is what `advance-branches` fast-forwards to,
          # and a shallow checkout cannot resolve it.
          fetch-depth: 0
      - id: parse
        # The same parser the stamping uses, so the two can never disagree
        # about what a tag means. It exits non-zero on a tag shape it does not
        # recognise, which fails the release rather than guessing.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          node apps/desktop/scripts/stamp-version.mjs --parse "$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-list -n1 "$TAG")" >> "$GITHUB_OUTPUT"
          if node apps/desktop/scripts/stamp-version.mjs --parse "$TAG" | grep -q '^prerelease=true$'; then
            echo 'variants=["beta"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["production","beta"]' >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: draft the release
    needs: meta
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'CyberCyclone' }}
    # Job-scoped: only the jobs that create, upload into, or publish the
    # GitHub release get write. Everything else keeps the workflow's read.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Created here rather than left to electron-builder, which would
      # otherwise have three matrix legs racing to create the same release.
      # Idempotent, so re-running a failed release run is safe.
      - run: |
          set -euo pipefail
          # An existing *draft* is the re-run case this exists for. An
          # existing *published* release is not: uploading into it with
          # EP_DRAFT would rewrite latest.yml and replace installers while
          # deployed clients are polling that very feed — the half-replaced
          # release the draft-first design exists to prevent. Re-releasing a
          # published tag is something a person should have to do on purpose.
          if existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$existing" = "true" ]; then
              echo "draft release $TAG already exists; reusing it"
              exit 0
            fi
            echo "::error::release $TAG is already published. Delete it first if you really mean to re-release this tag." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --draft \
            --generate-notes \
            $([ "$PRERELEASE" = "true" ] && echo --prerelease || true)

  desktop:
    name: package ${{ matrix.variant }} on ${{ matrix.os }}
    needs: [meta, create-release]
    if: ${{ github.repository_owner == 'CyberCyclone' }}
    permissions:
      contents: write
    strategy:
      # One platform failing to build must not cancel the other two: a release
      # missing Windows is still a release worth having for macOS and Linux,
      # and the draft makes that visible before anyone is offered it.
      fail-fast: false
      matrix:
        # macos-15 is arm64. An Intel mac build is a follow-up — it needs
        # @embedded-postgres/darwin-x64, which is not installed.
        os: [macos-15, ubuntu-latest, windows-latest]
        # Both apps for a release tag, the beta app alone for a prerelease.
        # Building the beta variant for a *stable* tag is not redundant: a
        # beta install only ever reads `beta*.yml`, so without a beta build in
        # that release its testers would sit on the last prerelease forever.
        variant: ${{ fromJSON(needs.meta.outputs.variants) }}
    runs-on: ${{ matrix.os }}
    # A repository secret is readable by a workflow on *any* branch. Naming an
    # environment lets the signing key live as an environment secret instead,
    # behind required reviewers and a deployment branch rule limited to tags —
    # so only a run someone approved can reach it. Until that is set up, this
    # line changes nothing: secrets still resolve from the repository.
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.meta.outputs.tag }}
      # Which application this leg packages: its name, bundle id, data
      # directory and update feed all follow from it.
      LOXAIC_VARIANT: ${{ matrix.variant }}
      # Upload into the draft the job above made, never into a published one.
      EP_DRAFT: "true"
      # Each leg ships only its own platform's sidecar; the other four would
      # be ~30 MB apiece of dead weight in the bundle — and, on macOS, three
      # more foreign binaries for codesign to walk.
      TSNET_PROXY_HOST_ONLY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: infra/tsnet-proxy/go.mod
          cache-dependency-path: infra/tsnet-proxy/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version from the tag
        run: node apps/desktop/scripts/stamp-version.mjs "$TAG"
        shell: bash
      - name: Package and upload
        # The signing key and Apple credentials reach exactly one step, on
        # exactly one platform. Declared job-wide they sat in the environment
        # of `pnpm install` — and every third-party postinstall script it runs
        # — on all three runners, two of which never use them. Two more facts
        # the shell below exists for: GitHub expands an *unset* secret to "",
        # which electron-builder does not treat as absent ("" passed its
        # `== null` guard on macOS and threw "not a file"); and on Windows
        # CSC_LINK is the fallback for WIN_CSC_LINK, so the Apple .p12 would
        # have been used to sign the NSIS installer. Anything empty is unset,
        # and everything is unset on a leg that is not macOS. electron-builder
        # imports CSC_LINK into a throwaway keychain itself; nothing else is
        # needed. Empty notarization variables would have been safe on their
        # own — getNotarizeOptions tests truthiness — but consistency is
        # cheaper than remembering which two of the five are sharp.
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ "$RUNNER_OS" != "macOS" ] || [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          # Signing opens every file in the bundle at once (@electron/osx-sign's
          # walkAsync runs isBinaryFile inside an unbounded Promise.all), and
          # the bundle holds ~16,000 files against a runner cap of 10,240 — the
          # second release died with EMFILE mid-signing. `ulimit` alone does
          # not help, because kern.maxfilesperproc still caps the process.
          # Reproduced on macos-15 against osx-sign's own walk: defaults fail,
          # ulimit-only fails, sysctl plus ulimit passes.
          if [ "$RUNNER_OS" = "macOS" ]; then
            sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=524288 >/dev/null
            ulimit -n 524288
          fi
          pnpm --filter @loxaic/desktop package:publish

  advance-branches:
    name: move the release pointers
    # `expo-update` is in this list and `publish-release`'s gate deliberately
    # does not include it, which is the whole point: the desktop release may
    # undraft on its own merits (its installers are real and uploaded), but a
    # branch pointer claims the *whole* release shipped. `if: success()`
    # evaluates over this job's own needs and nothing else, so without
    # `expo-update` here a failed mobile publish moved `beta` and `master`
    # anyway — desktop users updated, phone users got nothing, and the
    # pointers said it shipped.
    needs: [meta, publish-release, expo-update]
    runs-on: ubuntu-latest
    # Only once the release is actually published. A branch pointer here means
    # "this shipped", so moving it for a run that never undrafted would make
    # it mean "someone tried".
    if: ${{ success() && github.repository_owner == 'CyberCyclone' }}
    permissions:
      contents: write
    env:
      SHA: ${{ needs.meta.outputs.sha }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Not forced, deliberately: a tag cut from an older base would fail here
      # rather than rewriting what a branch says shipped. GITHUB_TOKEN pushes
      # never trigger workflows, so this cannot start another CI run.
      - run: |
          set -euo pipefail
          git push origin "$SHA:refs/heads/beta"
          echo "beta -> ${SHA:0:8}"
          if [ "$PRERELEASE" != "true" ]; then
            git push origin "$SHA:refs/heads/master"
            echo "master -> ${SHA:0:8}"
          fi

  publish-release:
    name: publish the release
    needs: [meta, expo-update, desktop]
    runs-on: ubuntu-latest
    # `desktop` is a three-way matrix with fail-fast: false, and a matrix job
    # concludes `failure` if any one leg does — so the default needs-success
    # gate would skip this on a single failed platform and strand the draft
    # forever, with the two good installers uploaded and invisible. That is
    # the opposite of what fail-fast: false was added for. Publish whenever
    # the run was not cancelled and the tag parsed; the asset count below is
    # what refuses a release with no installer at all.
    if: ${{ always() && github.repository_owner == 'CyberCyclone'
            && needs.meta.result == 'success'
            && needs.desktop.result != 'cancelled'
            && needs.expo-update.result != 'cancelled' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.meta.outputs.tag }}
      VARIANTS: ${{ join(fromJSON(needs.meta.outputs.variants), ' ') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The moment this runs, every installed desktop app can see the release.
      # It is last on purpose: it needs every installer that *did* build to
      # have finished uploading — and at least one to exist, since a release
      # nobody can install is worse than a draft someone can look at.
      - run: |
          set -euo pipefail
          # Counted per variant, not in total. Both variants upload into the
          # same draft, so a single count would let a release in which every
          # *stable* leg failed publish on the strength of beta's installers —
          # and every stable install would then see a release it cannot
          # install. The beta artifacts are named Loxaic-Beta-*, so the stable
          # ones are what is left.
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name | select(test("\\.(dmg|zip|AppImage|deb|exe)$"))')
          # Checked before the loop, because the loop cannot see it: with no
          # assets at all, `printf '%s\n' ""` still emits one empty line, and
          # `grep -vc '^Loxaic-Beta-'` counts that line — so the stable count
          # came out as 1 and a release with nothing installable published,
          # which is the exact opposite of what the loop is for.
          if [ -z "$assets" ]; then
            echo "::error::$TAG has no installer assets at all; leaving it a draft" >&2
            exit 1
          fi
          all_assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for variant in $VARIANTS; do
            if [ "$variant" = "beta" ]; then
              count=$(printf '%s\n' "$assets" | grep -c '^Loxaic-Beta-' || true)
            else
              count=$(printf '%s\n' "$assets" | grep -vc '^Loxaic-Beta-' || true)
            fi
            if [ "$count" = "0" ]; then
              echo "::error::no $variant installer was uploaded for $TAG; leaving it a draft" >&2
              exit 1
            fi
            # An installer is not proof its platform finished. The first
            # release showed it: the Linux leg uploaded its AppImage, failed
            # building the .deb, and this check published one installer out
            # of six. electron-builder writes a platform's update feed only
            # after every target for that platform has built, so every
            # platform that uploaded an installer must also have left its
            # feed. Checked per platform, not as a total: a count lets a
            # finished macOS vouch for a Linux leg that stopped halfway, and
            # that release's AppImages would never update again. A platform
            # with no installer at all is still allowed — fail-fast is off so
            # a release missing one platform ships the others.
            if [ "$variant" = "beta" ]; then
              channel=beta
              mine=$(printf '%s\n' "$assets" | grep '^Loxaic-Beta-' || true)
            else
              channel=latest
              mine=$(printf '%s\n' "$assets" | grep -v '^Loxaic-Beta-' || true)
            fi
            missing=""
            while IFS= read -r installer; do
              [ -n "$installer" ] || continue
              case "$installer" in
                *.dmg|*.zip) feed="$channel-mac.yml" ;;
                *.AppImage|*.deb)
                  case "$installer" in
                    *arm64*|*aarch64*) feed="$channel-linux-arm64.yml" ;;
                    *) feed="$channel-linux.yml" ;;
                  esac ;;
                *.exe) feed="$channel.yml" ;;
                *) continue ;;
              esac
              # A here-string, not `printf | grep -q`: under pipefail grep's
              # early exit can SIGPIPE printf and read as "not found".
              if ! grep -qxF "$feed" <<< "$all_assets"; then
                missing="$missing $installer (needs $feed)"
              fi
            done <<< "$mine"
            if [ -n "$missing" ]; then
              echo "::error::$variant platform uploaded installers but never finished:$missing; leaving it a draft" >&2
              exit 1
            fi
            echo "$variant: $count installer asset(s), every uploading platform finished"
          done
          echo "publishing $TAG"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  expo-update:
    name: publish ${{ matrix.variant }} update
    needs: meta
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'CyberCyclone' }}
    # EXPO_TOKEN can publish JavaScript to every channel, and with update
    # signing unavailable on this EAS plan it is the whole defence for every
    # installed app (AGENTS.md). Naming an environment is what lets it move
    # behind required reviewers and a tag-only deployment branch rule; until
    # it does, this line changes nothing and the secret still resolves from
    # the repository. Before relying on it: dev-update.yml reads the same
    # token on every push to `dev`, so the gate only protects anything once
    # that workflow is given a token of its own.
    environment: release
    strategy:
      # One variant failing must not cancel the other: a release that reached
      # production but not beta is still worth having, and the difference is
      # visible in the job list.
      fail-fast: false
      matrix:
        # A release tag publishes to production *and* beta, so beta stays a
        # strict superset: someone on the beta app must never be stranded on
        # an older build than the stable release they would otherwise have
        # had. A beta tag publishes to beta alone.
        variant: ${{ fromJSON(needs.meta.outputs.variants) }}
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VARIANT: ${{ matrix.variant }}
      FORCE_BUILD: ${{ github.event.inputs.force_native_build }}
      # The variant is the channel, the build profile and APP_VARIANT — but
      # *not* the EAS environment. EAS has exactly three of those
      # (development, preview, production), so eas.json maps the beta profile
      # to `preview`, and this has to map the same way or the publish asks for
      # an environment that does not exist while `eas build --profile beta` in
      # the next step quietly uses the right one.
      EAS_ENVIRONMENT: ${{ matrix.variant == 'beta' && 'preview' || 'production' }}
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Stamp the version from the tag
        run: node apps/desktop/scripts/stamp-version.mjs "$TAG"

      - name: Publish the update
        id: publish
        working-directory: apps/mobile
        # APP_VARIANT is set for the whole job, so the config this publishes
        # against is the same one the matching build used. They have to agree:
        # the channel is embedded in the binary and the variant decides the
        # runtime version, so a mismatch publishes an update that reaches
        # nobody and reports nothing.
        run: |
          set -euo pipefail
          eas update --channel "$VARIANT" --environment "$EAS_ENVIRONMENT" \
            --message "$TAG" --non-interactive --json > "update.json"
          # Each platform's update is published for that platform's own
          # runtime version — the fingerprint hashes native config, which
          # differs between iOS and Android — and that is what decides whether
          # each platform needs a native build below. The second release run
          # assumed one runtime across both, published successfully, and then
          # failed right here (`expected one runtime version, got
          # ["16ae…","e92e…"]`), so the build step never ran and no beta app
          # was built.
          #
          # Read from the publish itself rather than recomputed, so the two
          # can't disagree, and tolerant of the outer shape because eas'
          # --json output is versioned by the CLI, not by us.
          node -e '
            const fs = require("node:fs");
            const raw = JSON.parse(fs.readFileSync("update.json", "utf8"));
            const updates = Array.isArray(raw) ? raw : (raw.updates ?? [raw]);
            const byPlatform = {};
            for (const u of updates) {
              if (!u?.platform || !u?.runtimeVersion) continue;
              (byPlatform[u.platform] ??= new Set()).add(u.runtimeVersion);
            }
            const out = [];
            for (const platform of ["ios", "android"]) {
              const runtimes = [...(byPlatform[platform] ?? [])];
              if (runtimes.length !== 1) {
                console.error(`expected one ${platform} runtime version, got ${JSON.stringify(runtimes)}`);
                process.exit(1);
              }
              out.push(`runtime_${platform}=${runtimes[0]}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(`published ${process.env.VARIANT}: ${out.join(", ")}`);
          '

      - name: Build natively, but only for a runtime that has no build yet
        id: build
        working-directory: apps/mobile
        env:
          RUNTIME_IOS: ${{ steps.publish.outputs.runtime_ios }}
          RUNTIME_ANDROID: ${{ steps.publish.outputs.runtime_android }}
        # With the fingerprint runtime policy, a change to native code or
        # dependencies produces a new runtime version, and an update published
        # for it reaches *no existing binary*. So: ask whether a finished
        # build already exists for this runtime, and only build when none
        # does. Building on every release would cost 20-40 minutes and a queue
        # slot for what is usually a JS-only change.
        #
        # Asked per variant, not once: each variant has its own bundle
        # identifier, the fingerprint hashes native config, so their runtime
        # versions differ and a build of one says nothing about the other.
        #
        # The gate fails *closed*: an output shape it does not recognise is an
        # error, not "zero builds". Mapping the unknown to zero would silently
        # start the very builds this exists to prevent — with a step that
        # still succeeds and a log line indistinguishable from the real case.
        run: |
          set -euo pipefail
          FAILED=""
          for platform in ios android; do
            if [ "$platform" = "ios" ]; then RUNTIME="$RUNTIME_IOS"; else RUNTIME="$RUNTIME_ANDROID"; fi
            if [ "$FORCE_BUILD" = "true" ]; then
              echo "$platform: forced by workflow input"
            else
              COUNT=$(eas build:list \
                --platform "$platform" \
                --runtime-version "$RUNTIME" \
                --build-profile "$VARIANT" \
                --status finished \
                --limit 1 \
                --non-interactive \
                --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);if(!Array.isArray(v)){console.error("expected an array from eas build:list, got "+typeof v);process.exit(1);}process.stdout.write(String(v.length));})')
              if [ "$COUNT" != "0" ]; then
                # A binary for this runtime already exists, and the store is
                # assumed to have it — either from an earlier release run,
                # which submitted on completion, or from the bootstrap. Note
                # what that assumption rests on, because CI cannot check it:
                # iOS bootstraps with --auto-submit-with-profile, but Play
                # refuses an API upload to a listing with no prior release, so
                # the first Android bundle is uploaded **by hand** in Play
                # Console (docs/DEPLOY.md). Skip that upload and every release
                # cut at the bootstrap fingerprint skips here against an empty
                # store and reports success.
                #
                # Given it has been uploaded, there is nothing to send: the
                # binary is identical and the JS it runs was just published
                # over the air. This is the JS-only release AGENTS.md
                # describes — no new store build, TestFlight and Play version
                # numbers unchanged.
                #
                # It used to run `eas submit` here instead, and that could
                # never have worked: `resolveArchiveSourceAsync` throws "You
                # need to specify the archive source when running in
                # non-interactive mode" unless given --id/--latest/--path/--url,
                # and there is no implicit latest-build fallback. Supplying one
                # only moves the failure — `--latest` is not filtered by build
                # profile or runtime (only platform/distribution/status), so it
                # can pick the wrong binary, and `--id` re-submits something
                # the store already took, which Apple refuses as ITMS-4238 and
                # Play as a reused versionCode.
                #
                # Retrying a genuinely failed submission is a person running
                # `eas submit --platform <p> --profile <v> --id <build-id>`
                # against the build they mean. That is a different job from
                # "release the JS that just changed".
                echo "$platform: runtime $RUNTIME already has a finished $VARIANT build; nothing to build or submit"
                continue
              fi
              echo "$platform: no $VARIANT build for runtime $RUNTIME yet"
            fi
            # --no-wait: a build takes far longer than this workflow should,
            # and the update is already published — the binary catches up.
            #
            # Both platforms submit on completion: a store build is only
            # useful once the store has it, and the submission is scheduled
            # server-side so --no-wait still holds. iOS goes to TestFlight or
            # App Store Connect, Android to its Play listing's internal track
            # — neither goes live without a human, which is the point.
            #
            # Failures are collected rather than aborting the loop. The build
            # half still fails the step (see below), but iOS is simply first
            # in the list, and an Apple-side misconfiguration — an expired App
            # Store Connect key, a missing app record — must not stop Android
            # being queued at all.
            eas build --platform "$platform" --profile "$VARIANT" \
              --auto-submit-with-profile "$VARIANT" \
              --non-interactive --no-wait --json \
              > "build-$platform.json" || FAILED="$FAILED $platform:build"
          done

          # Failing closed, but only after both platforms have had their turn:
          # a build that could not even be queued is exactly the case where an
          # update has published for a runtime no binary will ever have.
          if [ -n "$FAILED" ]; then
            echo "::error::$VARIANT failed for:$FAILED" >&2
            exit 1
          fi

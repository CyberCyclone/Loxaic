name: Release

# Cutting a release is pushing a tag:
#   v1.2.3          → production (and beta, which is a superset of it)
#   v1.2.3-beta.4   → beta only
#
# The version is stamped from the tag rather than committed (see
# apps/desktop/scripts/stamp-version.mjs), so nothing here writes back to the
# repository.
#
# The release is created as a *draft* first and undrafted last, and that
# ordering is what makes it safe: GitHub's `/releases/latest` and its Atom
# feed both skip drafts, so the running desktop app cannot see a release
# whose installers are still uploading — or one where a platform failed to
# build at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to (re)publish, e.g. v1.2.3
        required: true
      force_native_build:
        description: Build native binaries even if this runtime already has some
        type: boolean
        default: false

# Nothing here writes to the repository — the version is stamped, not
# committed — so read is all the checkout needs. The desktop-installer stage
# raises this to write for the job that creates the GitHub release.
permissions:
  contents: read

# Never two releases of the same tag at once, and never cancel one halfway:
# a partially published release is worse than a slow one.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: parse tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: parse
        # The same parser the stamping uses, so the two can never disagree
        # about what a tag means. It exits non-zero on a tag shape it does not
        # recognise, which fails the release rather than guessing.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          node apps/desktop/scripts/stamp-version.mjs --parse "$TAG" >> "$GITHUB_OUTPUT"

  create-release:
    name: draft the release
    needs: meta
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'CyberCyclone' }}
    # Job-scoped: only the jobs that create, upload into, or publish the
    # GitHub release get write. Everything else keeps the workflow's read.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Created here rather than left to electron-builder, which would
      # otherwise have three matrix legs racing to create the same release.
      # Idempotent, so re-running a failed release run is safe.
      - run: |
          set -euo pipefail
          # An existing *draft* is the re-run case this exists for. An
          # existing *published* release is not: uploading into it with
          # EP_DRAFT would rewrite latest.yml and replace installers while
          # deployed clients are polling that very feed — the half-replaced
          # release the draft-first design exists to prevent. Re-releasing a
          # published tag is something a person should have to do on purpose.
          if existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$existing" = "true" ]; then
              echo "draft release $TAG already exists; reusing it"
              exit 0
            fi
            echo "::error::release $TAG is already published. Delete it first if you really mean to re-release this tag." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --draft \
            --generate-notes \
            $([ "$PRERELEASE" = "true" ] && echo --prerelease || true)

  desktop:
    name: package ${{ matrix.os }}
    needs: [meta, create-release]
    if: ${{ github.repository_owner == 'CyberCyclone' }}
    permissions:
      contents: write
    strategy:
      # One platform failing to build must not cancel the other two: a release
      # missing Windows is still a release worth having for macOS and Linux,
      # and the draft makes that visible before anyone is offered it.
      fail-fast: false
      matrix:
        # macos-15 is arm64. An Intel mac build is a follow-up — it needs
        # @embedded-postgres/darwin-x64, which is not installed.
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.meta.outputs.tag }}
      # Upload into the draft the job above made, never into a published one.
      EP_DRAFT: "true"
      # Each leg ships only its own platform's sidecar; the other four would
      # be ~30 MB apiece of dead weight in the bundle — and, on macOS, three
      # more foreign binaries for codesign to walk.
      TSNET_PROXY_HOST_ONLY: "1"
      # Read only on darwin (app-builder-lib's isSignAllowed checks
      # process.platform first), so these are harmlessly unused on the other
      # two legs rather than needing a per-leg conditional. electron-builder
      # imports CSC_LINK/CSC_KEY_PASSWORD into a throwaway keychain itself —
      # nothing here needs to create one by hand.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: infra/tsnet-proxy/go.mod
          cache-dependency-path: infra/tsnet-proxy/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version from the tag
        run: node apps/desktop/scripts/stamp-version.mjs "$TAG"
        shell: bash
      - name: Package and upload
        run: pnpm --filter @loxaic/desktop package:publish
        shell: bash

  publish-release:
    name: publish the release
    needs: [meta, expo-update, desktop]
    runs-on: ubuntu-latest
    # `desktop` is a three-way matrix with fail-fast: false, and a matrix job
    # concludes `failure` if any one leg does — so the default needs-success
    # gate would skip this on a single failed platform and strand the draft
    # forever, with the two good installers uploaded and invisible. That is
    # the opposite of what fail-fast: false was added for. Publish whenever
    # the run was not cancelled and the tag parsed; the asset count below is
    # what refuses a release with no installer at all.
    if: ${{ always() && github.repository_owner == 'CyberCyclone'
            && needs.meta.result == 'success'
            && needs.desktop.result != 'cancelled'
            && needs.expo-update.result != 'cancelled' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The moment this runs, every installed desktop app can see the release.
      # It is last on purpose: it needs every installer that *did* build to
      # have finished uploading — and at least one to exist, since a release
      # nobody can install is worse than a draft someone can look at.
      - run: |
          set -euo pipefail
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[] | select(.name | test("\\.(dmg|zip|AppImage|deb|exe)$"))] | length')
          if [ "$count" = "0" ]; then
            echo "::error::no installer was uploaded for $TAG; leaving it a draft" >&2
            exit 1
          fi
          echo "publishing $TAG with $count installer asset(s)"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  expo-update:
    name: publish update
    needs: meta
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'CyberCyclone' }}
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      FORCE_BUILD: ${{ github.event.inputs.force_native_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Stamp the version from the tag
        run: node apps/desktop/scripts/stamp-version.mjs "$TAG"

      - name: Publish the update
        id: publish
        working-directory: apps/mobile
        # A release tag publishes to *both* branches, so beta stays a strict
        # superset of production: someone on beta must never be stranded on an
        # older build than a stable release. A beta tag publishes to beta only.
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            BRANCHES="beta"
          else
            BRANCHES="production beta"
          fi
          for branch in $BRANCHES; do
            echo "publishing to $branch"
            eas update --branch "$branch" --message "$TAG" --non-interactive --json > "update-$branch.json"
          done
          # The runtime version the update was published for decides whether a
          # native build is needed below. Read from the publish itself rather
          # than recomputed, so the two can't disagree — and tolerant of shape
          # because eas' --json output is versioned by the CLI, not by us.
          RUNTIME=$(node -e '
            const fs = require("node:fs");
            const branch = process.argv[1];
            const raw = JSON.parse(fs.readFileSync(`update-${branch}.json`, "utf8"));
            const updates = Array.isArray(raw) ? raw : (raw.updates ?? [raw]);
            const runtimes = [...new Set(updates.map((u) => u?.runtimeVersion).filter(Boolean))];
            if (runtimes.length !== 1) {
              console.error(`expected one runtime version, got ${JSON.stringify(runtimes)}`);
              process.exit(1);
            }
            process.stdout.write(runtimes[0]);
          ' "${BRANCHES%% *}")
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "published for runtime $RUNTIME"

      - name: Build natively, but only for a runtime that has no build yet
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ steps.publish.outputs.runtime }}
        # With the fingerprint runtime policy, a change to native code or
        # dependencies produces a new runtime version, and an update published
        # for it reaches *no existing binary*. So: ask whether a finished
        # production build already exists for this runtime, and only build
        # when none does. Building on every release would cost 20-40 minutes
        # and a queue slot for what is usually a JS-only change.
        #
        # The gate fails *closed*: an output shape it does not recognise is an
        # error, not "zero builds". Mapping the unknown to zero would silently
        # start the very builds this exists to prevent — with a step that
        # still succeeds and a log line indistinguishable from the real case.
        run: |
          set -euo pipefail
          for platform in ios android; do
            if [ "$FORCE_BUILD" = "true" ]; then
              echo "$platform: forced by workflow input"
            else
              COUNT=$(eas build:list \
                --platform "$platform" \
                --runtime-version "$RUNTIME" \
                --build-profile production \
                --status finished \
                --limit 1 \
                --non-interactive \
                --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);if(!Array.isArray(v)){console.error("expected an array from eas build:list, got "+typeof v);process.exit(1);}process.stdout.write(String(v.length));})')
              if [ "$COUNT" != "0" ]; then
                echo "$platform: runtime $RUNTIME already has a finished build; skipping"
                continue
              fi
              echo "$platform: no build for runtime $RUNTIME yet"
            fi
            # --no-wait: a build takes far longer than this workflow should,
            # and the update is already published — the binary catches up.
            eas build --platform "$platform" --profile production --non-interactive --no-wait
          done

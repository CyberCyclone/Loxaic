name: Preview update

# Every merge to master goes out to the `preview` branch, which development
# builds follow. That is the whole point of the branch: it is where the
# current state of master can be opened on a device without cutting a
# release. Release tags are a different workflow (release.yml).
on:
  push:
    branches: [master]

# Holds EXPO_TOKEN on every push to master, so it gets nothing else: read is
# all the checkout needs, and the default would otherwise be the repository's
# — which may be write-all.
permissions:
  contents: read

# One publish at a time, and only the newest matters — an update superseded
# before it finished publishing is wasted work.
concurrency:
  group: preview-update
  cancel-in-progress: true

jobs:
  expo-preview:
    name: publish to preview
    runs-on: ubuntu-latest
    # A fork has no EXPO_TOKEN and no business publishing to this project's
    # update branches, so it skips the job rather than failing the push.
    if: ${{ github.repository_owner == 'CyberCyclone' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish
        working-directory: apps/mobile
        # No EXPO_PUBLIC_* endpoint baked in, deliberately: a published bundle
        # resolves its server the way every install does (auto-detect, then
        # the Settings override), rather than carrying one developer's tailnet
        # address to everyone who opens it.
        run: eas update --branch preview --message "${{ github.sha }}" --non-interactive

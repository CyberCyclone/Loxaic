name: CI

# `dev` is the trunk: every pull request targets it, and CI has to run on one
# or nothing is checked. `master` stays in both lists because a hotfix straight
# to a release branch is a legitimate path, and `pull_request` alone would not
# cover it: that checks `refs/pull/N/merge`, a throwaway merge computed when
# the PR opened, and release.yml runs no lint, typecheck or test of its own —
# so a hotfix merged and tagged would ship with nothing having run against the
# tree that actually shipped. The release workflow's own fast-forwards of
# `master` use GITHUB_TOKEN, which by GitHub's rule never triggers a workflow —
# so keeping master here costs nothing for those either.
on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# The only workflow a fork's pull request can run, so it holds nothing worth
# stealing: a read-only token, no secrets, and every action pinned to a commit
# (a tag can be moved to point at different code; a SHA cannot).
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # Expo SDK 57 needs >= 22.13; the `22` alias resolves to the latest 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # The tsnet sidecar is the one Go module in the repo, so it needs its own
  # job — `pnpm test` cannot see it, and nothing else would ever compile it
  # for a platform other than whoever last ran build.sh by hand.
  sidecar:
    name: sidecar (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tsnet-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: infra/tsnet-proxy/go.mod
          cache-dependency-path: infra/tsnet-proxy/go.sum
      - name: gofmt
        # `gofmt -l` prints unformatted files and exits 0 either way, so the
        # output is what has to be checked, not the status.
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # Cross-compiles every platform the desktop ships to (no
      # TSNET_PROXY_HOST_ONLY here, deliberately), so a change that only builds
      # on the developer's own machine fails here rather than at release time.
      - run: ./build.sh "$RUNNER_TEMP/tsnet-proxy"

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loxaic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loxaic
      REDIS_URL: redis://localhost:6379
      MOCK_INFERENCE: "true"
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The two Postgres-backed test files assume the schema already exists —
      # nothing else applies migrations for them (the server's own boot-time
      # migration step is never exercised by any test, see apps/server/src/index.ts).
      - run: pnpm --filter @loxaic/db db:migrate
      - run: pnpm --filter @loxaic/server test
      # No database needed; guards the native upload part (attachmentUpload.test.ts)
      # among others, which nothing else on CI exercises.
      - run: pnpm --filter @loxaic/mobile test
      # Likewise no database, no Docker, no display: the supervisor suite binds
      # loopback ports and writes temp dirs, and the executor one spawns a Node
      # child. It had never run here, which left the instance-config validation
      # every desktop install depends on covered only by whoever ran it locally.
      - run: pnpm --filter @loxaic/desktop test

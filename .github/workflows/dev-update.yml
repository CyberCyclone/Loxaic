name: Dev update

# Every merge to `dev` — the trunk — goes out over the air to the Loxaic Dev
# app, so what is on the trunk can be opened on a phone without cutting a
# release or building anything. Release tags are a different workflow
# (release.yml), and the beta and production apps never see this channel.
on:
  push:
    branches: [dev]

# Holds EXPO_TOKEN on every push to dev, so it gets nothing else: read is
# all the checkout needs, and the default would otherwise be the repository's
# — which may be write-all.
#
# Worth stating plainly, since the trigger branch now takes daily merges: OTA
# bundles are not code-signed (see AGENTS.md), so whoever can push to this
# branch can put arbitrary JS into every build that follows it, with the EAS
# account as the only thing in the way. That argues for `dev` requiring a pull
# request and a passing CI run before a merge — branch protection, which this
# repository cannot set while it is private on a free plan, so it is a thing
# to turn on the day it goes public rather than a thing already relied upon.
permissions:
  contents: read

# One publish at a time, and only the newest matters — an update superseded
# before it finished publishing is wasted work.
concurrency:
  group: dev-update
  cancel-in-progress: true

jobs:
  expo-dev:
    name: publish to the dev channel
    runs-on: ubuntu-latest
    # A fork has no EXPO_TOKEN and no business publishing to this project's
    # update branches, so it skips the job rather than failing the push.
    if: ${{ github.repository_owner == 'CyberCyclone' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish
        working-directory: apps/mobile
        env:
          # The same variant the dev app was *built* as. These have to agree:
          # the channel is embedded in the binary, and an update published
          # under a different variant has a different runtime version, so it
          # reaches nobody and nothing reports an error.
          APP_VARIANT: dev
        # `--environment development` is what supplies EXPO_PUBLIC_API_URL,
        # from EAS rather than from this repository — the same value the dev
        # build baked in, so the two cannot drift.
        #
        # This deliberately reverses the rule the preview workflow held to,
        # which baked in no endpoint so a published bundle resolved its server
        # the way every install does. That was right for a bundle anyone might
        # open; it is wrong for the dev app, which exists to point at the dev
        # stack and is private. Whoever installs it can still point it
        # elsewhere from the sign-in screen — the stored override wins over a
        # baked-in default.
        run: |
          eas update --channel dev --environment development \
            --message "${{ github.sha }}" --non-interactive

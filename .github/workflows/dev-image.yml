name: Dev image

# loxaic-dev (#320): the custom sandbox image for developing Loxaic inside a
# Loxaic agent chat. Built on the sandbox image, checked by its own selftest
# under the restrictions Loxaic gives every sandbox, and pushed to GHCR from
# `dev` only. A pull request that touches it builds and checks it, and pushes
# nothing.
on:
  pull_request:
    branches: [dev]
    paths:
      - infra/docker/sandbox.Dockerfile
      - infra/docker/sandbox/**
      - infra/docker/dev/**
      - .github/workflows/dev-image.yml
  push:
    branches: [dev]
    paths:
      - infra/docker/sandbox.Dockerfile
      - infra/docker/sandbox/**
      - infra/docker/dev/**
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read

# One build per branch at a time; a newer push supersedes an older one.
concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two jobs that do the same build, so that only the one that pushes holds
  # `packages: write`, and only on dev: a pull request's job never has it.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        # The image is about 9 GB; the runner's preinstalled SDKs are not needed.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: docker buildx bake -f infra/docker/dev/docker-bake.hcl --load
      - name: Selftest
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --network none --shm-size 64m \
            -v "$PWD/infra/docker/dev/selftest.sh:/selftest.sh:ro" loxaic-dev:local bash /selftest.sh

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: docker buildx bake -f infra/docker/dev/docker-bake.hcl --load
      - name: Selftest
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --network none --shm-size 64m \
            -v "$PWD/infra/docker/dev/selftest.sh:/selftest.sh:ro" loxaic-dev:local bash /selftest.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          SHA: ${{ github.sha }}
        run: |
          image=ghcr.io/cybercyclone/loxaic-dev
          docker tag loxaic-dev:local "$image:latest"
          docker tag loxaic-dev:local "$image:sha-${SHA::12}"
          docker push "$image:latest"
          docker push "$image:sha-${SHA::12}"

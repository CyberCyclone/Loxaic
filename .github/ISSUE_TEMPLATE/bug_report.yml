name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through private reporting instead — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version line from Settings (it includes the build number and update channel).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Client
      multiple: true
      options: [Desktop (macOS), Desktop (Windows), Desktop (Linux), Web, iOS, Android]
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How the server runs
      options:
        - Desktop app — Solo
        - Desktop app — Host
        - Desktop app — Client of another host
        - Headless desktop
        - Docker Compose
        - From source (pnpm dev)
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Inference backend and model
      placeholder: e.g. llama.cpp b6000 with Qwen3-30B, LM Studio, OpenRouter
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server or app logs around the failure. Remove anything private (keys, hostnames) first.
      render: text

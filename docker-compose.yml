# Dev infrastructure only — Postgres, Redis, inference, ntfy on the usual dev
# ports (5432, 6379, 4002, 4003). The server itself runs bare-metal via
# `pnpm --filter @shannon/server dev` (see HANDOVER.md's run matrix), not as a
# compose service, so it can hot-reload with tsx watch.
#
# For the containerized, stable/production stack (its own ports, DB, and
# volumes — safe to run alongside this dev stack) see docker-compose.prod.yml.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shannon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --host 0.0.0.0 --port 8080
      -m /models/model.gguf
      --ctx-size 8192
      --jinja
      --parallel 2
    volumes:
      - ./models:/models:ro
    ports:
      - "4002:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    environment:
      NTFY_BASE_URL: "http://localhost:4003"
    ports:
      - "4003:80"

volumes:
  pgdata:
  redisdata:

# AMD GPUs through ROCm, e.g. a Radeon Pro V620 (gfx1030) on Proxmox.
# Usage: docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d
#
# The Vulkan override usually works on AMD as well, with less setup; use this
# one when ROCm is what the host is built around.
services:
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"

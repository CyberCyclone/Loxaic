# Proxmox + AMD V620 (gfx1030) override for the dev inference service.
# Usage: docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d
#
# Applies equally to the stable stack's optional dedicated inference service
# (docker-compose.prod.yml's `inference` profile):
#   docker compose -f docker-compose.prod.yml -f docker-compose.rocm.yml --profile inference --env-file .env.prod up -d

services:
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    command: >
      --host 0.0.0.0 --port 8080
      -m /models/model.gguf
      --ctx-size 32768
      --jinja
      -ngl 999
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
